# lint — shellcheck everything executable on push/PR. Ordinary dotfiles CI.
name: lint

on:
  push:
    paths: [install.sh, bin/**, .github/workflows/lint.yml]
  pull_request:
    paths: [install.sh, bin/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: bash -n install.sh && echo "syntax OK"
      - run: shellcheck -S warning install.sh bin/*
