name: tailnet-runner

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "'all' (hourly shape) or one tenant (debug hold)"
        required: false
        default: "all"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

# One calling job per tenant. Reusable-call jobs accept ONLY: name, uses,
# with, secrets, needs, if, permissions — no strategy/matrix, no
# environment, no runs-on. Per-tenant keys are distinct repo-level secrets
# (TS_AUTHKEY_<TENANT>); pilot t1/t2 share TS_AUTHKEY_EPHEMERAL until the
# tenant trio in tofu/tailnet/tenants.tf.example mints distinct keys.

jobs:
  t1:
    if: github.event_name == 'schedule' || inputs.tenant == 'all' || inputs.tenant == 't1'
    concurrency:
      group: tailnet-runner-t1
      cancel-in-progress: false
    uses: treaulab/infra/.github/workflows/tailnet-runner.yml@af90adb6db8de76dd9b8ebb50d76ec8c08f0e355
    with:
      mode: ${{ github.event_name == 'schedule' && 'hourly' || 'debug' }}
      hostname-prefix: gh-t1
      box-name: box
      edge-url: https://box.treau.me/
      quiet: "true"
      startup-delay-seconds: "0"
    secrets:
      TS_AUTHKEY_EPHEMERAL: ${{ secrets.TS_AUTHKEY_EPHEMERAL }}

  t2:
    if: github.event_name == 'schedule' || inputs.tenant == 'all' || inputs.tenant == 't2'
    concurrency:
      group: tailnet-runner-t2
      cancel-in-progress: false
    uses: treaulab/infra/.github/workflows/tailnet-runner.yml@af90adb6db8de76dd9b8ebb50d76ec8c08f0e355
    with:
      mode: ${{ github.event_name == 'schedule' && 'hourly' || 'debug' }}
      hostname-prefix: gh-t2
      box-name: box
      edge-url: https://box.treau.me/
      quiet: "true"
      startup-delay-seconds: "180"
    secrets:
      TS_AUTHKEY_EPHEMERAL: ${{ secrets.TS_AUTHKEY_EPHEMERAL }}
